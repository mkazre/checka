<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · CheckA+</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f6;font-family:system-ui,Arial,sans-serif;color:#2d2d2d;text-align:center;padding:24px}
  .box{max-width:360px}
  .dot{width:64px;height:64px;border-radius:50%;background:#e7f6ec;color:#37b34a;display:grid;place-items:center;margin:0 auto 18px;font-size:30px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#6b7682;line-height:1.6;font-size:14px}
  button{margin-top:16px;background:#37b34a;color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="dot">⚡</div>
    <h1>You're offline</h1>
    <p>No internet connection right now. Any inspection work you've already opened stays available, and photos or saves will sync automatically once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
