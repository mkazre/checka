; Checka — allow large inspection photo/video uploads (iOS re-encodes HEIC to
; large JPEGs, so a "2 MB" phone photo can arrive at 8–15 MB). post_max_size
; must be larger than upload_max_filesize to leave room for other form fields.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 40
memory_limit = 256M
max_execution_time = 120
